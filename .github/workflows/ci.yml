name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    # Public-repo safe: GitHub-hosted, read-only, no secrets in scope.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ github.token }}"}
  hosted-postgres:
    # GitHub-hosted with a throwaway Postgres; no secrets, safe for a public repo.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: ci, POSTGRES_INITDB_ARGS: "--encoding=UTF8"}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install "psycopg[binary]" psycopg_pool
      - name: Postgres, pooled
        run: PYTHONPATH=src:. python -m unittest hosted.test_hosted -v
        env: {VERIFY_TEST_PG_DSN: "host=localhost port=5432 user=postgres password=ci dbname=postgres", VERIFY_DB_POOL: "10"}
      - name: Postgres, single connection
        run: PYTHONPATH=src:. python -m unittest hosted.test_hosted -v
        env: {VERIFY_TEST_PG_DSN: "host=localhost port=5432 user=postgres password=ci dbname=postgres", VERIFY_DB_POOL: "1"}
  terraform:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: hosted/deploy}}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: "1.5.7"}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
  test:
    # Only trusted repository code may use the shared AWS runner.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: [self-hosted, Linux, X64, aws, verify]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python version
        run: python3 -c 'import sys; assert sys.version_info >= (3, 10), sys.version; print(sys.version)'
      - name: Offline tests (no Stripe/Zendesk secrets)
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Hosted ledger tests
        run: PYTHONPATH=src:. python3 -m unittest hosted.test_hosted -v
      - name: Validate shipped contracts
        run: PYTHONPATH=src python3 -m verify validate contracts/*.json
      - name: CLI smoke
        run: |
          cd "$RUNNER_TEMP"
          PYTHONPATH="$GITHUB_WORKSPACE/src" python3 -m verify demo local
          PYTHONPATH="$GITHUB_WORKSPACE/src" python3 -m verify ledger demo_out/ledger.db
          echo 'Offline tests and CLI smoke passed on the shared AWS runner.' >> "$GITHUB_STEP_SUMMARY"
