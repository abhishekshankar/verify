# NEW host only. PostgreSQL also binds solely to loopback; no public 5432 rule.
local   all      postgres                          peer
local   all      all                               reject
hostssl verify   verify_runtime      127.0.0.1/32  scram-sha-256
hostssl verify   verify_runtime      ::1/128       scram-sha-256
hostssl verify   verify_maintenance  127.0.0.1/32  scram-sha-256
hostssl verify   verify_maintenance  ::1/128       scram-sha-256
host    all      all                 0.0.0.0/0     reject
host    all      all                 ::/0          reject
