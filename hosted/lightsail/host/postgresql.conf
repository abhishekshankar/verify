# Review as a PostgreSQL16 conf.d include. Applies to the NEW host only.
listen_addresses = '127.0.0.1,::1'
ssl = on
ssl_cert_file = '/etc/postgresql/16/main/tls/server.pem'
ssl_key_file = '/etc/postgresql/16/main/tls/server-key.pem'
password_encryption = 'scram-sha-256'
fsync = on
full_page_writes = on
synchronous_commit = on
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=verify archive-push %p'
archive_timeout = '60s'
log_statement = 'none'
# No guessed memory/connection tuning. Test app + DB + backup/restore peak demand.
