[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verify-outcomes"
version = "0.1.0"
description = "Independent readback verification for AI agents and automations. Unknown fails closed."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
verify = "verify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
